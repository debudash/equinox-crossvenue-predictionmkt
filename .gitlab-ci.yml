# GitLab CI is OFF (owner decision, 2026-10-10): this project has no runner
# (shared runners disabled, none registered), so every pipeline sat pending and
# then failed with stuck_pending_no_matching_runners. The checks run locally
# with `make test lint guard` before each merge (docs/test-results.md).
# To turn CI back on once a runner exists, delete the workflow block below.
workflow:
  rules:
    - when: never

# Same steps as .github/workflows/ci.yml, for the GitLab host (decision Q-3).
check:
  image: golang:1.26
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOTOOLCHAIN: auto
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.go/pkg/mod]
  script:
    - make setup
    - make test
    - make lint
    - make guard
